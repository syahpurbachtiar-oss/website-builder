<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monas 3D Experience</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #030305; 
            font-family: 'Inter', -apple-system, sans-serif; 
            color: white;
        }
        canvas { 
            display: block; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        
        #ui-layer {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            pointer-events: none; 
            z-index: 10; 
            opacity: 0; 
        }
        
        h1 {
            font-size: clamp(3rem, 8vw, 7rem); 
            letter-spacing: 2vw; 
            font-weight: 100;
            text-transform: uppercase; 
            margin: 0; 
            margin-left: 2vw; /* offset for tracking */
            pointer-events: auto;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.3); 
            cursor: pointer;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            background: linear-gradient(180deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        h1:hover { 
            letter-spacing: 2.5vw; 
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.8); 
            transform: scale(1.05);
        }
        
        .subtitle {
            letter-spacing: 8px; 
            font-size: clamp(0.7rem, 1.5vw, 1rem); 
            margin-top: 20px;
            text-transform: uppercase; 
            font-weight: 300;
            color: #888;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 20px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: monospace;
            letter-spacing: 5px;
            color: #ffaa00;
            z-index: 20;
            transition: opacity 1s;
        }
        
        .nav-links {
            position: absolute;
            bottom: 40px;
            display: flex;
            gap: 40px;
            pointer-events: auto;
        }
        
        .nav-link {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 3px;
            transition: color 0.3s, text-shadow 0.3s;
        }
        
        .nav-link:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }
    </style>
    <!-- WebGL & Animation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="loading">INITIALIZING GEOMETRY...</div>
    
    <div id="ui-layer">
        <h1 id="trigger">MONAS</h1>
        <div class="subtitle">NATIONAL MONUMENT OF INDONESIA</div>
        
        <div class="nav-links">
            <a href="#" class="nav-link">Discover</a>
            <a href="#" class="nav-link">History</a>
            <a href="#" class="nav-link">Visit</a>
        </div>
    </div>

    <script>
        // --- 1. SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030305, 0.015);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const monasGroup = new THREE.Group();
        scene.add(monasGroup);

        // --- 2. PROCEDURAL MONAS GEOMETRY ---
        // Materials
        const wireMat = new THREE.LineBasicMaterial({ 
            color: 0x4488ff, 
            transparent: true, 
            opacity: 0.6,
            blending: THREE.AdditiveBlending 
        });
        
        const goldMat = new THREE.LineBasicMaterial({ 
            color: 0xffaa00, 
            transparent: true, 
            opacity: 0.9,
            blending: THREE.AdditiveBlending 
        });

        // Helper function for tapered shapes (Cawan, Tugu)
        function createTapered(rTop, rBottom, height, yPos, mat) {
            const geo = new THREE.CylinderGeometry(rTop, rBottom, height, 4, 1, false, Math.PI / 4);
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, mat);
            line.position.y = yPos;
            return line;
        }

        // Helper function for boxes (Base)
        function createBox(w, h, d, yPos, mat) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, mat);
            line.position.y = yPos;
            return line;
        }

        // Building Monas (Approximate Proportions)
        
        // 1. Pelataran Bawah (Base)
        monasGroup.add(createBox(20, 1, 20, 0, wireMat));
        monasGroup.add(createBox(18, 0.5, 18, 0.75, wireMat));
        
        // 2. Cawan (Cup/Lower platform)
        monasGroup.add(createTapered(6, 4, 5, 3.5, wireMat));
        monasGroup.add(createBox(8.5, 0.5, 8.5, 6.25, wireMat)); // Pelataran atas
        
        // 3. Tugu (Obelisk)
        // Tall tapering pillar
        monasGroup.add(createTapered(1.5, 2.5, 25, 19, wireMat));
        
        // 4. Lidah Api (Flame of Independence)
        monasGroup.add(createTapered(2.5, 1, 1, 32, goldMat)); // Flame base
        monasGroup.add(createTapered(0.1, 2.5, 4, 34.5, goldMat)); // Flame body
        monasGroup.add(createTapered(0, 1.5, 2, 37.5, goldMat)); // Flame tip
        
        // Create an inner glow for the flame
        const flameCoreGeo = new THREE.CylinderGeometry(0, 1, 5, 4, 1, false, Math.PI/4);
        const flameCoreMat = new THREE.MeshBasicMaterial({ 
            color: 0xffdd44, 
            transparent: true, 
            opacity: 0.2, 
            blending: THREE.AdditiveBlending 
        });
        const flameCore = new THREE.Mesh(flameCoreGeo, flameCoreMat);
        flameCore.position.y = 35;
        monasGroup.add(flameCore);

        // Center the group
        monasGroup.position.y = -15;

        // --- 3. PARTICLES / CONSTELLATION ---
        const particlesCount = 2000;
        const posArray = new Float32Array(particlesCount * 3);
        const velocityArray = [];

        for(let i = 0; i < particlesCount * 3; i+=3) {
            // Cylinder distribution around Monas
            const r = 5 + Math.random() * 40;
            const theta = 2 * Math.PI * Math.random();
            const y = (Math.random() - 0.5) * 80;
            
            posArray[i] = r * Math.cos(theta);
            posArray[i+1] = y;
            posArray[i+2] = r * Math.sin(theta);
            
            velocityArray.push({
                x: (Math.random() - 0.5) * 0.02,
                y: (Math.random() - 0.5) * 0.02,
                z: (Math.random() - 0.5) * 0.02
            });
        }
        
        const particlesGeometry = new THREE.BufferGeometry();
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        
        // Soft particle texture
        const canvas = document.createElement('canvas');
        canvas.width = 16; canvas.height = 16;
        const context = canvas.getContext('2d');
        const gradient = context.createRadialGradient(8, 8, 0, 8, 8, 8);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, 16, 16);
        const particleTexture = new THREE.CanvasTexture(canvas);

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.3, 
            map: particleTexture, 
            transparent: true,
            blending: THREE.AdditiveBlending, 
            depthWrite: false, 
            color: 0x88aaff,
            opacity: 0.5
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // --- 4. INTERACTION & PARALLAX ---
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        // Interactive Title Hover
        const title = document.getElementById('trigger');
        title.addEventListener('mouseenter', () => {
            gsap.to(wireMat, { color: 0xffaa00, opacity: 1, duration: 1 });
            gsap.to(particlesMaterial.color, { r: 1, g: 0.7, b: 0.2, duration: 1 });
        });
        title.addEventListener('mouseleave', () => {
            gsap.to(wireMat, { color: 0x4488ff, opacity: 0.6, duration: 1 });
            gsap.to(particlesMaterial.color, { r: 0.53, g: 0.66, b: 1, duration: 1 });
        });

        // --- 5. ANIMATION SEQUENCE ---
        camera.position.set(0, -20, 10);
        camera.lookAt(0, 10, 0);

        setTimeout(() => {
            document.getElementById('loading').style.opacity = '0';
            
            // Camera cinematic fly-in
            gsap.to(camera.position, { 
                z: 60, 
                y: 5, 
                duration: 4, 
                ease: "power3.inOut" 
            });
            
            gsap.to(monasGroup.rotation, {
                y: Math.PI * 2,
                duration: 5,
                ease: "power2.out"
            });
            
            setTimeout(() => {
                document.getElementById('ui-layer').style.opacity = '1';
                document.getElementById('loading').style.display = 'none';
            }, 2500);
            
        }, 1500);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Liquid Parallax
            targetX = mouseX * 0.001;
            targetY = mouseY * 0.001;
            
            monasGroup.rotation.y += 0.002; // Base rotation
            monasGroup.rotation.y += (targetX - monasGroup.rotation.y + elapsedTime*0.1) * 0.05; // Mouse influence
            monasGroup.rotation.x = targetY * 0.2;
            
            // Flame subtle pulse
            flameCore.scale.x = 1 + Math.sin(elapsedTime * 5) * 0.1;
            flameCore.scale.z = 1 + Math.sin(elapsedTime * 5) * 0.1;

            // Particles logic
            const positions = particlesGeometry.attributes.position.array;
            for(let i = 0; i < particlesCount; i++) {
                let i3 = i * 3;
                
                positions[i3] += velocityArray[i].x;
                positions[i3+1] += velocityArray[i].y;
                positions[i3+2] += velocityArray[i].z;
                
                // Slowly rotate particles
                const x = positions[i3];
                const z = positions[i3+2];
                positions[i3] = x * Math.cos(0.001) - z * Math.sin(0.001);
                positions[i3+2] = z * Math.cos(0.001) + x * Math.sin(0.001);
                
                // Bounds
                if (positions[i3+1] > 40) positions[i3+1] = -40;
                if (positions[i3+1] < -40) positions[i3+1] = 40;
            }
            particlesGeometry.attributes.position.needsUpdate = true;
            
            // Camera subtle follow
            camera.position.x += (targetX * 20 - camera.position.x) * 0.02;
            camera.position.y += (-targetY * 10 - camera.position.y + 5) * 0.02;
            camera.lookAt(0, 10, 0);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

print("File generated: monas_3d_experience.html")
