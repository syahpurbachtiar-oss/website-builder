<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mainframe Agency</title>
    
    <!-- Fonts -->
    <link href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" rel="stylesheet" type="text/css"/>
    <link href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" rel="stylesheet" type="text/css"/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['var(--font-body)'],
                        heading: ['var(--font-heading)']
                    }
                }
            }
        }
    </script>
    
    <!-- React, ReactDOM, and Babel for in-browser JSX compilation -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, sans-serif;
            --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            font-family: var(--font-body);
            background-color: #000;
            color: #fff;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .animate-blink {
            animation: blink 1s step-end infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Hook: Typewriter
        const useTypewriter = (text, speed = 38, startDelay = 600) => {
            const [displayed, setDisplayed] = useState('');
            const [done, setDone] = useState(false);

            useEffect(() => {
                let timeout;
                let currentIndex = 0;
                
                const typeChar = () => {
                    if (currentIndex < text.length) {
                        setDisplayed(text.substring(0, currentIndex + 1));
                        currentIndex++;
                        timeout = setTimeout(typeChar, speed);
                    } else {
                        setDone(true);
                    }
                };

                timeout = setTimeout(typeChar, startDelay);
                return () => clearTimeout(timeout);
            }, [text, speed, startDelay]);

            return { displayed, done };
        };

        // Component: Video Background
        const VideoBackground = () => {
            const videoRef = useRef(null);
            const isSeeking = useRef(false);
            const targetTime = useRef(0);
            const prevX = useRef(null);

            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (!videoRef.current) return;
                    
                    if (prevX.current === null) {
                        prevX.current = e.clientX;
                        return;
                    }
                    
                    const delta = e.clientX - prevX.current;
                    prevX.current = e.clientX;
                    
                    const SENSITIVITY = 0.8;
                    const timeChange = (delta / window.innerWidth) * SENSITIVITY * videoRef.current.duration;
                    
                    let newTime = videoRef.current.currentTime + timeChange;
                    if (isNaN(newTime)) return;
                    
                    newTime = Math.max(0, Math.min(newTime, videoRef.current.duration));
                    targetTime.current = newTime;
                    
                    if (!isSeeking.current && videoRef.current.readyState >= 1) {
                        isSeeking.current = true;
                        videoRef.current.currentTime = targetTime.current;
                    }
                };

                window.addEventListener('mousemove', handleMouseMove);
                return () => window.removeEventListener('mousemove', handleMouseMove);
            }, []);

            const handleSeeked = () => {
                if (!videoRef.current) return;
                
                if (Math.abs(videoRef.current.currentTime - targetTime.current) > 0.05) {
                    videoRef.current.currentTime = targetTime.current;
                } else {
                    isSeeking.current = false;
                }
            };

            return (
                <video 
                    ref={videoRef}
                    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260826_041744_63efcd78-bf7d-4039-99e2-2461e8a61903.mp4"
                    muted 
                    playsInline 
                    preload="auto"
                    onSeeked={handleSeeked}
                    style={{ position: 'fixed', inset: 0, zIndex: 0, objectFit: 'cover', objectPosition: '70% center', width: '100%', height: '100%' }}
                />
            );
        };

        // Component: Navbar
        const Navbar = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const navLinks = ['Labs', 'Studio', 'Openings', 'Shop'];

            return (
                <>
                    {/* Fixed Navbar */}
                    <nav className="fixed top-0 left-0 w-full z-10 px-5 sm:px-8 py-4 sm:py-5 flex justify-between items-center pointer-events-auto">
                        
                        {/* Logo */}
                        <div className="flex flex-row items-center gap-3 relative z-[20]">
                            <span className="font-heading text-[21px] sm:text-[26px] tracking-tight text-white">Mainframe&reg;</span>
                            <span className="text-[25px] sm:text-[30px] text-white select-none" style={{ letterSpacing: '-0.02em' }}>&lowast;</span>
                        </div>
                        
                        {/* Desktop Links */}
                        <div className="hidden md:flex flex-row text-[23px] text-white">
                            {navLinks.map((item, i, arr) => (
                                <span key={item}>
                                    <a href="#" className="hover:opacity-60 transition-opacity">{item}</a>
                                    {i < arr.length - 1 && ', '}
                                </span>
                            ))}
                        </div>
                        
                        {/* Desktop CTA */}
                        <a href="#" className="hidden md:block text-[23px] text-white underline underline-offset-2 hover:opacity-60 transition-opacity">
                            Get in touch
                        </a>
                        
                        {/* Mobile Hamburger */}
                        <button 
                            className="md:hidden flex flex-col gap-[5px] relative z-[20]"
                            onClick={() => setIsMenuOpen(!isMenuOpen)}
                            aria-label="Toggle menu"
                        >
                            <div className={`w-6 h-[2px] bg-white transition-all duration-300 ${isMenuOpen ? 'rotate-45 translate-y-[7px]' : ''}`}></div>
                            <div className={`w-6 h-[2px] bg-white transition-all duration-300 ${isMenuOpen ? 'opacity-0' : 'opacity-100'}`}></div>
                            <div className={`w-6 h-[2px] bg-white transition-all duration-300 ${isMenuOpen ? '-rotate-45 -translate-y-[7px]' : ''}`}></div>
                        </button>
                    </nav>

                    {/* Mobile Overlay */}
                    <div 
                        className={`md:hidden fixed inset-0 bg-black/90 backdrop-blur-md flex flex-col justify-center px-8 gap-8 transition-opacity duration-300 z-[9] ${isMenuOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}
                    >
                        {navLinks.map(item => (
                            <a key={item} href="#" className="text-[32px] font-medium text-white">{item}</a>
                        ))}
                        <a href="#" className="text-[32px] font-medium text-white underline">Get in touch</a>
                    </div>
                </>
            );
        };

        // Main App Component
        const App = () => {
            const { displayed, done } = useTypewriter("Glad you stopped in. Good taste tends to find us. Now, what are we building?");
            const [showButtons, setShowButtons] = useState(false);

            useEffect(() => {
                const timer = setTimeout(() => {
                    setShowButtons(true);
                }, 400);
                return () => clearTimeout(timer);
            }, []);

            const handleCopy = () => {
                navigator.clipboard.writeText('hello@mainframe.co');
            };

            const pillStyles = "inline-flex items-center justify-center bg-white text-black border border-black/10 rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap hover:bg-black hover:text-white transition-colors duration-200";

            return (
                <div className="relative w-full h-screen overflow-hidden">
                    <VideoBackground />
                    <Navbar />
                    
                    <main className="relative z-[1] w-full h-screen flex flex-col justify-end pb-12 md:justify-center md:pb-0 px-5 sm:px-8 md:px-10 pointer-events-none">
                        <div className="max-w-xl relative z-10 pointer-events-auto">
                            
                            {/* Blurred Intro Label */}
                            <div 
                                className="pointer-events-none select-none mb-5 sm:mb-6 text-white font-[400] blur-[4px]" 
                                style={{ fontSize: 'clamp(18px, 4vw, 26px)', lineHeight: '1.3' }}
                            >
                                Hey there, meet A.R.I.A,<br/>
                                Mainframe's Adaptive Response Interface Agent
                            </div>
                            
                            {/* Typewriter Text */}
                            <p 
                                className="text-white mb-5 sm:mb-6 font-[400]"
                                style={{ fontSize: 'clamp(18px, 4vw, 26px)', lineHeight: '1.35', minHeight: '54px' }}
                            >
                                {displayed}
                                {!done && <span className="inline-block w-[2px] h-[1.1em] bg-white align-middle ml-[2px] animate-blink"></span>}
                            </p>
                            
                            {/* Action Pills */}
                            <div 
                                className="flex flex-wrap gap-y-1"
                                style={{
                                    opacity: showButtons ? 1 : 0,
                                    transform: showButtons ? 'translateY(0)' : 'translateY(8px)',
                                    transition: 'opacity 0.4s ease, transform 0.4s ease'
                                }}
                            >
                                {['Pitch us an idea', 'Come work here', 'Send a brief hello', 'See how we operate'].map(label => (
                                    <button key={label} className={pillStyles}>
                                        {label}
                                    </button>
                                ))}
                                
                                <button 
                                    onClick={handleCopy} 
                                    className="inline-flex items-center justify-center bg-transparent text-white border border-white rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap gap-2 sm:gap-3 hover:bg-white hover:text-black transition-colors duration-200 group"
                                >
                                    <span>Reach us: <span className="underline underline-offset-1">hello@mainframe.co</span></span>
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="stroke-white group-hover:stroke-black transition-colors duration-200">
                                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                    </svg>
                                </button>
                            </div>

                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
