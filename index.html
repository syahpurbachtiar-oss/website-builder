<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Builder - Syahpur Bachtiar</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #010103; font-family: 'Inter', -apple-system, sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: none; z-index: 10; opacity: 0; transition: opacity 2.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        h1 {
            color: #ffffff; font-size: clamp(3rem, 6vw, 8rem); letter-spacing: 1vw; font-weight: 100;
            text-transform: uppercase; margin: 0; pointer-events: auto;
            text-shadow: 0 0 40px rgba(255,255,255,0.3); cursor: pointer;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            text-align: center;
        }
        h1:hover { 
            letter-spacing: 1.5vw; 
            text-shadow: 0 0 60px rgba(255,255,255,0.8), 0 0 20px rgba(136, 170, 255, 0.5); 
            transform: scale(1.02);
        }
        
        .subtitle {
            color: #888; letter-spacing: 6px; font-size: clamp(0.8rem, 2vw, 1.2rem); margin-top: 20px;
            text-transform: uppercase; font-weight: 300;
            background: linear-gradient(90deg, #fff, #88aaff, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s infinite linear;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        #intro-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #010103; z-index: 20; display: flex; justify-content: center; align-items: center;
            color: #555; font-family: monospace; letter-spacing: 8px; text-transform: uppercase;
            transition: opacity 2s ease-out; pointer-events: none;
        }
        
        .glitch { animation: pulse 2s infinite; font-size: 0.9rem; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; text-shadow: 0 0 15px rgba(255,255,255,0.5); } 100% { opacity: 0.3; } }
        
        /* Tombol Kontak 3D Elegan */
        .contact-container {
            margin-top: 50px;
            display: flex;
            gap: 30px;
            pointer-events: auto;
        }
        
        .btn-3d {
            position: relative;
            padding: 15px 35px;
            font-family: monospace;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 4px;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
            text-transform: uppercase;
        }
        
        .btn-3d::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.7s ease;
        }
        
        .btn-3d:hover::before { left: 100%; }
        
        .btn-3d:hover {
            color: #fff;
            transform: translateY(-8px) scale(1.05);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        /* WA Glow */
        .btn-wa:hover {
            box-shadow: 0 15px 40px rgba(37, 211, 102, 0.25), inset 0 0 20px rgba(37, 211, 102, 0.15);
            text-shadow: 0 0 12px rgba(37, 211, 102, 0.9);
            border-color: rgba(37, 211, 102, 0.5);
        }
        
        /* Email Glow */
        .btn-email:hover {
            box-shadow: 0 15px 40px rgba(234, 67, 53, 0.25), inset 0 0 20px rgba(234, 67, 53, 0.15);
            text-shadow: 0 0 12px rgba(234, 67, 53, 0.9);
            border-color: rgba(234, 67, 53, 0.5);
        }
    </style>
    <!-- WebGL & Animation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="intro-screen"><span class="glitch">Initializing AAA Engine...</span></div>
    
    <div id="ui-layer">
        <h1 id="trigger">WEBSITE BUILDER</h1>
        <div class="subtitle">SYAHPUR BACHTIAR</div>
        
        <div class="contact-container">
            <a href="https://wa.me/6281398788960" target="_blank" class="btn-3d btn-wa">WhatsApp</a>
            <a href="mailto:syahpurbachtiar@gmail.com" class="btn-3d btn-email">Email</a>
        </div>
    </div>

    <script>
        // --- 1. CORE SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010103, 0.0012); // Fog lebih tebal di kejauhan untuk depth
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- 2. THE CORE (Layered Wireframes) ---
        const coreGroup = new THREE.Group();
        scene.add(coreGroup);

        // Outer Core
        const outerGeo = new THREE.IcosahedronGeometry(18, 2);
        const outerMat = new THREE.MeshBasicMaterial({ 
            color: 0x223355, wireframe: true, transparent: true, opacity: 0 
        });
        const outerCore = new THREE.Mesh(outerGeo, outerMat);
        coreGroup.add(outerCore);

        // Inner Core (Bikin efek parallax 3D berlapis)
        const innerGeo = new THREE.IcosahedronGeometry(12, 1);
        const innerMat = new THREE.MeshBasicMaterial({ 
            color: 0x4466aa, wireframe: true, transparent: true, opacity: 0 
        });
        const innerCore = new THREE.Mesh(innerGeo, innerMat);
        coreGroup.add(innerCore);

        // --- 3. DYNAMIC PARTICLE GALAXY ---
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 4500; // Partikel diperbanyak untuk kesan mewah
        const posArray = new Float32Array(particlesCount * 3);
        const velocityArray = [];
        const phaseArray = new Float32Array(particlesCount); // Untuk efek kelap-kelip

        for(let i = 0; i < particlesCount * 3; i+=3) {
            // Distribusi spherical untuk efek galaksi
            const r = 30 + Math.random() * 120;
            const theta = 2 * Math.PI * Math.random();
            const phi = Math.acos(2 * Math.random() - 1);
            
            posArray[i] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i+1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i+2] = r * Math.cos(phi);
            
            velocityArray.push({
                x: (Math.random() - 0.5) * 0.015,
                y: (Math.random() - 0.5) * 0.015,
                z: (Math.random() - 0.5) * 0.015
            });
            phaseArray[i/3] = Math.random() * Math.PI * 2;
        }
        
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('phase', new THREE.BufferAttribute(phaseArray, 1));
        
        // Texture bintang yang sangat lembut (Generate via Canvas)
        const canvas = document.createElement('canvas');
        canvas.width = 32; canvas.height = 32;
        const context = canvas.getContext('2d');
        const gradient = context.createRadialGradient(16, 16, 0, 16, 16, 16);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.2, 'rgba(136, 170, 255, 0.8)');
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, 32, 32);
        const particleTexture = new THREE.CanvasTexture(canvas);

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.4, 
            map: particleTexture, 
            transparent: true,
            blending: THREE.AdditiveBlending, 
            depthWrite: false, 
            color: 0xffffff,
            opacity: 0.6
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // --- 4. GLOWING ANOMALIES (Sparks instead of literal butterflies) ---
        const sparks = [];
        const sparkGeo = new THREE.PlaneGeometry(0.8, 0.2); 
        const sparkMat = new THREE.MeshBasicMaterial({ 
            color: 0x88aaff, side: THREE.DoubleSide, transparent: true, opacity: 0.8,
            blending: THREE.AdditiveBlending, depthWrite: false
        });

        function spawnSpark(x, y) {
            const s = new THREE.Mesh(sparkGeo, sparkMat);
            const vector = new THREE.Vector3(x, y, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const distance = -camera.position.z / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));
            
            s.position.copy(pos);
            s.rotation.z = Math.random() * Math.PI;
            s.userData = {
                velocity: new THREE.Vector3((Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2, Math.random()*0.1),
                life: 1.0,
                decay: 0.01 + Math.random() * 0.02
            };
            scene.add(s);
            sparks.push(s);
        }

        // --- 5. INTERACTION & PARALLAX ---
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
            
            const normX = (event.clientX / window.innerWidth) * 2 - 1;
            const normY = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Spawn sparks on fast movement
            if (Math.random() > 0.92) spawnSpark(normX, normY);
        });

        // Cinematic Hover Effect on Title
        const title = document.getElementById('trigger');
        title.addEventListener('mouseenter', () => {
            gsap.to(particlesMaterial.color, { r: 1, g: 0.4, b: 0.6, duration: 1.5, ease: "power2.out" });
            gsap.to(outerMat, { opacity: 0.05, duration: 1 });
            gsap.to(innerMat, { opacity: 0.15, duration: 1 });
        });
        title.addEventListener('mouseleave', () => {
            gsap.to(particlesMaterial.color, { r: 1, g: 1, b: 1, duration: 1.5, ease: "power2.in" });
            gsap.to(outerMat, { opacity: 0.15, duration: 1 });
            gsap.to(innerMat, { opacity: 0.25, duration: 1 });
        });

        // --- 6. AAA ANIMATION SEQUENCE ---
        camera.position.z = 2;

        setTimeout(() => {
            const intro = document.getElementById('intro-screen');
            intro.style.opacity = '0';
            
            // Kamera mundur secara sinematik
            gsap.to(camera.position, { z: 50, duration: 4, ease: "power3.out" });
            
            // Wireframe memudar masuk
            gsap.to(outerMat, { opacity: 0.15, duration: 3, ease: "power2.inOut", delay: 0.5 });
            gsap.to(innerMat, { opacity: 0.25, duration: 3, ease: "power2.inOut", delay: 0.8 });
            
            setTimeout(() => {
                document.getElementById('ui-layer').style.opacity = '1';
                intro.style.display = 'none';
            }, 2500);
            
        }, 1800);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Liquid Parallax
            targetX = mouseX * 0.0015;
            targetY = mouseY * 0.0015;
            
            camera.position.x += (targetX * 25 - camera.position.x) * 0.03;
            camera.position.y += (-targetY * 25 - camera.position.y) * 0.03;
            camera.lookAt(scene.position);

            // Multi-layered Core rotation
            outerCore.rotation.y += 0.001;
            outerCore.rotation.x += 0.0005;
            outerCore.rotation.z -= 0.0008;
            
            innerCore.rotation.y -= 0.002;
            innerCore.rotation.x -= 0.001;

            // Fluid Particles logic
            const positions = particlesGeometry.attributes.position.array;
            for(let i = 0; i < particlesCount; i++) {
                let i3 = i * 3;
                
                positions[i3] += velocityArray[i].x;
                positions[i3+1] += velocityArray[i].y;
                positions[i3+2] += velocityArray[i].z;
                
                // Mouse attraction
                positions[i3] -= targetX * 0.05;
                positions[i3+1] -= targetY * 0.05;
                
                // Soft boundary loop
                if (Math.abs(positions[i3]) > 150) positions[i3] *= -0.95;
                if (Math.abs(positions[i3+1]) > 150) positions[i3+1] *= -0.95;
                if (Math.abs(positions[i3+2]) > 150) positions[i3+2] *= -0.95;
            }
            particlesGeometry.attributes.position.needsUpdate = true;
            
            // Subtle galaxy rotation
            particlesMesh.rotation.y = elapsedTime * 0.05;
            particlesMesh.rotation.z = Math.sin(elapsedTime * 0.1) * 0.1;

            // Sparks animation (Replacing butterflies with elegant light streaks)
            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.position.add(s.userData.velocity);
                s.rotation.z += 0.1;
                s.scale.x = s.userData.life * 2;
                
                s.userData.life -= s.userData.decay;
                s.material.opacity = s.userData.life;
                
                if (s.userData.life <= 0) {
                    scene.remove(s);
                    sparks.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
